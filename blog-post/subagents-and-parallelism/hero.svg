<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 650" width="1400" height="650" role="img" aria-label="Subagents buy context isolation — three dense side sessions returning three thin summaries into one main window, one of them with its edit tool crossed out">
  <defs>
    <style>
      .ink   { fill: #12203A; }
      .mute  { fill: #6B7789; }
      .accent{ fill: #E0662E; }
      .h     { font-family: Georgia, 'Times New Roman', serif; }
      .m     { font-family: 'SF Mono', 'DejaVu Sans Mono', Menlo, monospace; }
      .s     { font-family: -apple-system, 'Helvetica Neue', Arial, sans-serif; }
    </style>
  </defs>

  <rect width="1400" height="650" fill="#FAF8F4"/>

  <!-- kicker -->
  <rect x="80" y="92" width="120" height="3" class="accent"/>
  <text x="80" y="122" class="m" font-size="14" fill="#8A93A3" letter-spacing="1">SUBAGENTS · DELEGATION</text>

  <!-- title -->
  <text x="80" y="206" class="h ink" font-size="58" font-weight="700">Subagents buy a clean window</text>
  <text x="80" y="252" class="s mute" font-size="24">They burn their own context on the mess and hand back the conclusion.</text>

  <!-- column labels -->
  <text x="80" y="308" class="m" font-size="14" fill="#B0B7C2" letter-spacing="1.5">DELEGATED SESSIONS</text>
  <text x="660" y="308" class="m" font-size="15" fill="#12203A" letter-spacing="1.5">YOUR CONTEXT WINDOW</text>

  <!-- satellite 1: dense -->
  <rect x="80" y="326" width="300" height="74" rx="5" fill="#12203A"/>
  <text x="96" y="352" class="m" font-size="14" fill="#FAF8F4" letter-spacing="1">LOG SWEEP · 40 CI RUNS</text>
  <g fill="#FAF8F4" fill-opacity="0.18">
    <rect x="96" y="364" width="250" height="4" rx="2"/>
    <rect x="96" y="373" width="210" height="4" rx="2"/>
    <rect x="96" y="382" width="265" height="4" rx="2"/>
    <rect x="96" y="391" width="190" height="4" rx="2"/>
  </g>

  <!-- satellite 2: dense -->
  <rect x="80" y="414" width="300" height="74" rx="5" fill="#12203A"/>
  <text x="96" y="440" class="m" font-size="14" fill="#FAF8F4" letter-spacing="1">FAN-OUT SEARCH</text>
  <g fill="#FAF8F4" fill-opacity="0.18">
    <rect x="96" y="452" width="230" height="4" rx="2"/>
    <rect x="96" y="461" width="268" height="4" rx="2"/>
    <rect x="96" y="470" width="205" height="4" rx="2"/>
    <rect x="96" y="479" width="245" height="4" rx="2"/>
  </g>

  <!-- satellite 3: dense, and it cannot edit -->
  <rect x="80" y="502" width="300" height="74" rx="5" fill="#12203A"/>
  <text x="96" y="528" class="m" font-size="14" fill="#FAF8F4" letter-spacing="1">API-REVIEWER</text>
  <g fill="#FAF8F4" fill-opacity="0.18">
    <rect x="96" y="540" width="180" height="4" rx="2"/>
    <rect x="96" y="549" width="150" height="4" rx="2"/>
    <rect x="96" y="558" width="195" height="4" rx="2"/>
    <rect x="96" y="567" width="160" height="4" rx="2"/>
  </g>
  <!-- crossed-out pencil: no edit tool -->
  <g transform="translate(292 522) scale(1.3)">
    <rect x="0" y="0" width="5" height="9" rx="1" fill="#FAF8F4" fill-opacity="0.75"/>
    <rect x="6" y="0" width="20" height="9" fill="#FAF8F4" fill-opacity="0.75"/>
    <polygon points="26,0 35,4.5 26,9" fill="#FAF8F4" fill-opacity="0.75"/>
    <line x1="-5" y1="16" x2="40" y2="-7" stroke="#E0662E" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- thin returns: each arrow is visibly slighter than the box that emits it -->
  <g fill="none" stroke="#E0662E" stroke-width="1.5">
    <path d="M 380 363 C 500 363, 545 375, 650 375"/>
    <path d="M 380 451 C 500 451, 545 437, 650 437"/>
    <path d="M 380 539 C 500 539, 545 499, 650 499"/>
  </g>
  <g class="accent">
    <polygon points="650,371 659,375 650,379"/>
    <polygon points="650,433 659,437 650,441"/>
    <polygon points="650,495 659,499 650,503"/>
  </g>

  <!-- the main window: mostly empty, which is the point -->
  <rect x="660" y="326" width="660" height="250" rx="10" fill="none" stroke="#12203A" stroke-width="3"/>

  <rect x="682" y="358" width="616" height="34" rx="5" class="accent"/>
  <text x="700" y="381" class="s" font-size="16" font-weight="700" fill="#FFFFFF">three lines, not forty runs of logs</text>

  <rect x="682" y="420" width="616" height="34" rx="5" class="accent"/>
  <text x="700" y="443" class="s" font-size="16" font-weight="700" fill="#FFFFFF">four lines, not four hundred</text>

  <rect x="682" y="482" width="616" height="34" rx="5" class="accent"/>
  <text x="700" y="505" class="s" font-size="16" font-weight="700" fill="#FFFFFF">findings in prose — nothing silently patched</text>

  <!-- footers -->
  <text x="80" y="606" class="m" font-size="14" fill="#8A93A3">tools: Read, Grep, Glob, Bash — no Edit, no Write</text>
  <text x="660" y="606" class="s" font-size="16" fill="#6B7789">Speed is a side effect. The clean window is the product.</text>

</svg>
