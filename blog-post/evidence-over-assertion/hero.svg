<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 650" width="1400" height="650" role="img" aria-label="Done is five separate claims: chain links for ticket, branch, PR, tests and runtime, with the runtime link hanging open">
  <defs>
    <style>
      .ink   { fill: #12203A; }
      .mute  { fill: #6B7789; }
      .accent{ fill: #E0662E; }
      .h     { font-family: Georgia, 'Times New Roman', serif; }
      .m     { font-family: 'SF Mono', 'DejaVu Sans Mono', Menlo, monospace; }
      .s     { font-family: -apple-system, 'Helvetica Neue', Arial, sans-serif; }
    </style>
  </defs>

  <rect width="1400" height="650" fill="#FAF8F4"/>

  <!-- kicker -->
  <rect x="80" y="92" width="120" height="3" class="accent"/>
  <text x="80" y="122" class="m" font-size="14" fill="#8A93A3" letter-spacing="1">FIVE SIGNALS · ONE WORD</text>

  <!-- title -->
  <text x="80" y="206" class="h ink" font-size="58" font-weight="700">&#8220;Done&#8221; is five separate claims</text>
  <text x="80" y="252" class="s mute" font-size="24">Each one has its own proof. Collapse them and the proof is gone.</text>

  <!-- the struck-through word, sitting over the link that is open -->
  <text x="1012" y="332" class="h mute" font-size="38" font-style="italic" text-anchor="middle">done</text>
  <rect x="954" y="318" width="116" height="3" class="accent"/>

  <!-- chain: four closed links -->
  <g fill="none" stroke="#12203A" stroke-width="11">
    <rect x="290" y="380" width="196" height="100" rx="50"/>
    <rect x="446" y="380" width="196" height="100" rx="50"/>
    <rect x="602" y="380" width="196" height="100" rx="50"/>
    <rect x="758" y="380" width="196" height="100" rx="50"/>
  </g>

  <!-- chain: the fifth link, open -->
  <path d="M 1035 380 H 1060 A 50 50 0 0 1 1060 480 H 964 A 50 50 0 0 1 964 380 H 995"
        fill="none" stroke="#E0662E" stroke-width="11" stroke-linecap="round"/>

  <!-- link labels -->
  <g class="m" font-size="16" letter-spacing="1.5" text-anchor="middle" fill="#12203A">
    <text x="388" y="436">TICKET</text>
    <text x="544" y="436">BRANCH</text>
    <text x="700" y="436">PR</text>
    <text x="856" y="436">TESTS</text>
    <text x="1012" y="436" class="accent">RUNTIME</text>
  </g>

  <!-- what you can actually point at, under each link -->
  <g class="m" font-size="14" text-anchor="middle" fill="#8A93A3">
    <text x="388" y="514">the board</text>
    <text x="544" y="514">git log</text>
    <text x="700" y="514">the diff</text>
    <text x="856" y="514">exit 0</text>
    <text x="1012" y="514" class="accent">no evidence</text>
  </g>

  <text x="700" y="582" class="s" font-size="19" fill="#6B7789" text-anchor="middle">Four green signals and one open link is not done. It is four green signals.</text>

</svg>
