<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 650" width="1400" height="650" role="img" aria-label="Context is the product: instructions, retrieved context and delegated summaries inside one window">
  <defs>
    <style>
      .ink   { fill: #12203A; }
      .mute  { fill: #6B7789; }
      .accent{ fill: #E0662E; }
      .h     { font-family: Georgia, 'Times New Roman', serif; }
      .m     { font-family: 'SF Mono', 'DejaVu Sans Mono', Menlo, monospace; }
      .s     { font-family: -apple-system, 'Helvetica Neue', Arial, sans-serif; }
    </style>
  </defs>

  <rect width="1400" height="650" fill="#FAF8F4"/>

  <!-- series label -->
  <rect x="80" y="54" width="120" height="3" class="accent"/>
  <text x="80" y="84" class="m" font-size="14" fill="#8A93A3" letter-spacing="1">FROM ASSISTANT TO AGENT</text>

  <!-- number -->
  <text x="80" y="178" class="h" font-size="120" font-weight="700" fill="#E4DED3">03</text>

  <!-- title -->
  <text x="80" y="238" class="h ink" font-size="58" font-weight="700">Context is the product</text>
  <text x="80" y="284" class="s mute" font-size="24">You are not writing prompts. You are curating a window.</text>

  <!-- raw material feeding in (left) -->
  <text x="80" y="360" class="m" font-size="14" fill="#B0B7C2" letter-spacing="1">RAW MATERIAL</text>
  <g class="m" font-size="15" fill="#8A93A3">
    <text x="80" y="392">200 search hits</text>
    <text x="80" y="420">3,000-line client</text>
    <text x="80" y="448">full test output</text>
    <text x="80" y="476">40 files read</text>
    <text x="80" y="504">yesterday's session</text>
  </g>

  <!-- funnel from raw material into the delegated band -->
  <path d="M 300 380 L 470 476 L 470 512 L 300 516 Z" fill="#E0662E" fill-opacity="0.16"/>
  <path d="M 300 380 L 470 476" stroke="#E0662E" stroke-width="2" fill="none" stroke-opacity="0.55"/>
  <path d="M 300 516 L 470 512" stroke="#E0662E" stroke-width="2" fill="none" stroke-opacity="0.55"/>

  <!-- the window -->
  <rect x="470" y="330" width="840" height="270" rx="10" fill="none" stroke="#12203A" stroke-width="3"/>
  <text x="470" y="316" class="m" font-size="15" fill="#12203A" letter-spacing="1.5">CONTEXT WINDOW</text>

  <!-- band 1: instructions -->
  <rect x="492" y="352" width="796" height="74" rx="5" fill="#12203A"/>
  <text x="514" y="384" class="s" font-size="21" font-weight="700" fill="#FAF8F4">Instructions</text>
  <text x="514" y="410" class="s" font-size="15" fill="#A9B3C4">committed files · loaded every turn · you fully control this</text>

  <!-- band 2: retrieved -->
  <rect x="492" y="436" width="796" height="74" rx="5" fill="#12203A" fill-opacity="0.55"/>
  <text x="514" y="468" class="s" font-size="21" font-weight="700" fill="#FAF8F4">Retrieved</text>
  <text x="514" y="494" class="s" font-size="15" fill="#E4E8EF">files, command output, connector results · grows all day</text>

  <!-- band 3: delegated — deliberately thin -->
  <rect x="492" y="520" width="796" height="36" rx="5" fill="#E0662E"/>
  <text x="514" y="544" class="s" font-size="18" font-weight="700" fill="#FFFFFF">Delegated<tspan class="s" font-size="15" font-weight="400" fill="#FFE3D4">   four lines instead of two hundred</tspan></text>

  <text x="492" y="584" class="s" font-size="15" fill="#8A93A3">Delegation is the only one that removes volume and keeps the conclusion.</text>

</svg>
