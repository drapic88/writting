<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 650" width="1400" height="650" role="img" aria-label="A ten-section readiness checklist gating an agent's first edit, with non-goals, architecture impact, rollback and monitoring marked as the four everyone skips">
  <defs>
    <style>
      .ink   { fill: #12203A; }
      .mute  { fill: #6B7789; }
      .accent{ fill: #E0662E; }
      .h     { font-family: Georgia, 'Times New Roman', serif; }
      .m     { font-family: 'SF Mono', 'DejaVu Sans Mono', Menlo, monospace; }
      .s     { font-family: -apple-system, 'Helvetica Neue', Arial, sans-serif; }
    </style>
    <marker id="arA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#E0662E"/>
    </marker>
  </defs>

  <rect width="1400" height="650" fill="#FAF8F4"/>

  <!-- kicker -->
  <rect x="80" y="92" width="120" height="3" class="accent"/>
  <text x="80" y="122" class="m" font-size="14" fill="#8A93A3" letter-spacing="1">READINESS · PLANNING</text>

  <!-- title -->
  <text x="80" y="206" class="h ink" font-size="58" font-weight="700">The readiness gate</text>
  <text x="80" y="252" class="s mute" font-size="24">Redirecting a plan costs a paragraph. Redirecting an implementation costs a day.</text>

  <!-- ============ LEFT: the ten sections ============ -->
  <text x="80" y="316" class="m" font-size="14" fill="#12203A" letter-spacing="1.5">BEFORE ANY CODE</text>

  <g class="s" font-size="17">
    <rect x="80" y="340" width="14" height="14" fill="#C6CCD6"/>
    <text x="108" y="352" class="mute">Business goal</text>

    <rect x="80" y="366" width="14" height="14" class="accent"/>
    <text x="108" y="378" class="ink" font-weight="700">Requirements &amp; non-goals</text>

    <rect x="80" y="392" width="14" height="14" fill="#C6CCD6"/>
    <text x="108" y="404" class="mute">Acceptance criteria</text>

    <rect x="80" y="418" width="14" height="14" class="accent"/>
    <text x="108" y="430" class="ink" font-weight="700">Architecture impact</text>

    <rect x="80" y="444" width="14" height="14" fill="#C6CCD6"/>
    <text x="108" y="456" class="mute">Data changes</text>

    <rect x="80" y="470" width="14" height="14" fill="#C6CCD6"/>
    <text x="108" y="482" class="mute">API changes</text>

    <rect x="80" y="496" width="14" height="14" fill="#C6CCD6"/>
    <text x="108" y="508" class="mute">Security review</text>

    <rect x="80" y="522" width="14" height="14" fill="#C6CCD6"/>
    <text x="108" y="534" class="mute">Test plan</text>

    <rect x="80" y="548" width="14" height="14" class="accent"/>
    <text x="108" y="560" class="ink" font-weight="700">Rollback plan</text>

    <rect x="80" y="574" width="14" height="14" class="accent"/>
    <text x="108" y="586" class="ink" font-weight="700">Monitoring plan</text>
  </g>

  <!-- ============ THE GATE ============ -->
  <text x="524" y="316" class="m" font-size="14" fill="#E0662E" letter-spacing="1.5" text-anchor="middle">GATE</text>
  <rect x="518" y="336" width="8" height="252" class="accent"/>
  <line x1="534" y1="404" x2="576" y2="404" stroke="#E0662E" stroke-width="2" marker-end="url(#arA)"/>

  <!-- ============ RIGHT: the rule, then the edit ============ -->
  <rect x="600" y="336" width="720" height="136" rx="10" fill="#12203A"/>
  <text x="628" y="372" class="m" font-size="14" fill="#8A93A3">CLAUDE.md</text>
  <text x="628" y="408" class="m" font-size="19" fill="#FAF8F4">No feature code before the ten</text>
  <text x="628" y="436" class="m" font-size="19" fill="#FAF8F4">readiness sections exist on the ticket.</text>

  <text x="600" y="524" class="s ink" font-size="18">Then, and only then, the first edit.</text>
  <text x="600" y="556" class="s mute" font-size="16">Four of the ten are the ones nobody writes. They are the expensive four.</text>

</svg>
