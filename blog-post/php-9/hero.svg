<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 650" width="1400" height="650" role="img" aria-label="PHP 9 is a list of decisions already running on PHP 8.6 — and two of them print warnings, not deprecations">
  <defs>
    <style>
      .ink   { fill: #12203A; }
      .mute  { fill: #6B7789; }
      .accent{ fill: #E0662E; }
      .h     { font-family: Georgia, 'Times New Roman', serif; }
      .m     { font-family: 'SF Mono', 'DejaVu Sans Mono', Menlo, monospace; }
      .s     { font-family: -apple-system, 'Helvetica Neue', Arial, sans-serif; }
    </style>
  </defs>

  <rect width="1400" height="650" fill="#FAF8F4"/>

  <!-- kicker -->
  <rect x="80" y="72" width="120" height="3" class="accent"/>
  <text x="80" y="102" class="m" font-size="14" fill="#8A93A3" letter-spacing="1">PHP 9 · BREAKING CHANGES</text>

  <!-- title -->
  <text x="80" y="176" class="h ink" font-size="50" font-weight="700">The PHP 9 upgrade is already in your error log</text>
  <text x="80" y="220" class="s mute" font-size="24">No release date, and master is 8.7.0-dev. The breaking changes are voted anyway.</text>

  <!-- the log -->
  <text x="80" y="294" class="m" font-size="15" fill="#12203A" letter-spacing="1.5">PHP 8.6.0 RC3 · WHAT 9.0 LOOKS LIKE TODAY</text>
  <rect x="80" y="310" width="860" height="276" rx="10" fill="#12203A"/>

  <!-- warnings: the two a deprecation scan misses -->
  <g class="m" font-size="17">
    <text x="108" y="352" fill="#E0662E">Warning: <tspan fill="#FAF8F4">Undefined variable $undefinedVar</tspan></text>
    <text x="108" y="386" fill="#E0662E">Warning: <tspan fill="#FAF8F4">Undefined property: stdClass::$nope</tspan></text>
  </g>

  <rect x="104" y="404" width="812" height="1" fill="#6B7789"/>

  <!-- deprecations: what everyone already counts -->
  <g class="m" font-size="17" fill="#A9B3C4">
    <text x="108" y="440">Deprecated: Using ${var} in strings is deprecated</text>
    <text x="108" y="472">Deprecated: Automatic conversion of false to array</text>
    <text x="108" y="504">Deprecated: Implicitly marking parameter as nullable</text>
    <text x="108" y="536">Deprecated: S implements the Serializable interface</text>
    <text x="108" y="568">Deprecated: Calling get_class() without arguments</text>
  </g>

  <!-- annotation: warnings -->
  <rect x="972" y="330" width="4" height="66" class="accent"/>
  <text x="996" y="352" class="s" font-size="21" font-weight="700" fill="#E0662E">Missed by a Deprecated: filter</text>
  <text x="996" y="380" class="s" font-size="16" fill="#12203A">Voted 33–8 and 31–5 to throw Error in 9.0.</text>

  <!-- annotation: deprecations -->
  <rect x="972" y="420" width="4" height="158" fill="#E4DED3"/>
  <text x="996" y="446" class="s" font-size="21" font-weight="700" fill="#12203A">What an upgrade scan counts</text>
  <text x="996" y="474" class="s" font-size="16" fill="#6B7789">Removed or turned into errors in 9.0,</text>
  <text x="996" y="498" class="s" font-size="16" fill="#6B7789">and labelled as such today.</text>

  <text x="80" y="622" class="s" font-size="15" fill="#8A93A3">Seven of the accepted PHP 9.0 changes, one example each, run on php:8.6.0RC3-cli. Messages shortened.</text>

</svg>
