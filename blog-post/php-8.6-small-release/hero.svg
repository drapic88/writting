<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1260" viewBox="0 0 2400 1260">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0A0E1F"/>
      <stop offset="55%" stop-color="#131233"/>
      <stop offset="100%" stop-color="#1D1447"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#6E5BD6" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#6E5BD6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#2BB3C9" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#2BB3C9" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="num" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#A99BFF"/>
      <stop offset="50%" stop-color="#7C6BF0"/>
      <stop offset="100%" stop-color="#38C6D9"/>
    </linearGradient>
    <pattern id="dots" width="48" height="48" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.5" fill="#FFFFFF" fill-opacity="0.05"/>
    </pattern>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7C6BF0" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#38C6D9" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="2400" height="1260" fill="url(#bg)"/>
  <rect width="2400" height="1260" fill="url(#dots)"/>
  <ellipse cx="2130" cy="180" rx="1000" ry="760" fill="url(#glow)"/>
  <ellipse cx="180" cy="1180" rx="820" ry="620" fill="url(#glow2)"/>


  <!-- decorative placeholder motif, balances the right third -->
  <g opacity="0.5">
    <circle cx="2020" cy="640" r="316" fill="none" stroke="#8C7BFF" stroke-opacity="0.16" stroke-width="2"/>
    <circle cx="2020" cy="640" r="238" fill="#8C7BFF" fill-opacity="0.045"/>
    <text x="2020" y="812" text-anchor="middle" font-family="SF Mono, Menlo, Monaco, monospace"
          font-size="440" font-weight="700" fill="url(#num)" fill-opacity="0.42">?</text>
  </g>
  <text x="2020" y="1010" text-anchor="middle" font-family="SF Mono, Menlo, Monaco, monospace"
        font-size="30" letter-spacing="4" fill="#7C86AE">the placeholder</text>

  <!-- eyebrow -->
  <rect x="160" y="252" width="86" height="4" rx="2" fill="url(#rule)"/>
  <text x="284" y="268" font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="34" font-weight="600" letter-spacing="7.5" fill="#9AA3C9">
    RELEASE PREVIEW · NOVEMBER 19, 2026
  </text>

  <!-- title -->
  <text x="152" y="560" font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="248" font-weight="700" letter-spacing="-6" fill="#FFFFFF">PHP<tspan
        fill="url(#num)" dx="34">8.6</tspan></text>

  <!-- subtitle -->
  <text x="160" y="672" font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="70" font-weight="400" letter-spacing="-0.8" fill="#C9CFEC">
    What's new, what breaks, and how to migrate
  </text>

  <!-- code card -->
  <rect x="160" y="768" width="1560" height="196" rx="26"
        fill="#FFFFFF" fill-opacity="0.045" stroke="#FFFFFF" stroke-opacity="0.12"/>
  <circle cx="212" cy="818" r="9" fill="#FF6B6B" fill-opacity="0.75"/>
  <circle cx="244" cy="818" r="9" fill="#FFC53D" fill-opacity="0.75"/>
  <circle cx="276" cy="818" r="9" fill="#3FD68C" fill-opacity="0.75"/>
  <text x="316" y="827" font-family="SF Mono, Menlo, Monaco, monospace"
        font-size="30" fill="#7C86AE">// partial function application</text>
  <text x="212" y="912" font-family="SF Mono, Menlo, Monaco, monospace"
        font-size="46" fill="#DCE3FF"><tspan fill="#9AD8FF">$slug</tspan> = <tspan
        fill="#A99BFF">str_replace</tspan>(<tspan fill="#9EE6B4">' '</tspan>, <tspan
        fill="#9EE6B4">'-'</tspan>, <tspan fill="#FFC53D" font-weight="700">?</tspan>);</text>

  <!-- chips -->
  <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="34"
     font-weight="500" fill="#AEB6DA">
    <rect x="160" y="1046" width="284" height="72" rx="36" fill="#FFFFFF" fill-opacity="0.06"
          stroke="#FFFFFF" stroke-opacity="0.10"/>
    <text x="302" y="1091" text-anchor="middle">Time\Duration</text>

    <rect x="464" y="1046" width="212" height="72" rx="36" fill="#FFFFFF" fill-opacity="0.06"
          stroke="#FFFFFF" stroke-opacity="0.10"/>
    <text x="570" y="1091" text-anchor="middle">clamp()</text>

    <rect x="696" y="1046" width="266" height="72" rx="36" fill="#FFFFFF" fill-opacity="0.06"
          stroke="#FFFFFF" stroke-opacity="0.10"/>
    <text x="829" y="1091" text-anchor="middle">Polling API</text>

    <rect x="982" y="1046" width="396" height="72" rx="36" fill="#FFC53D" fill-opacity="0.10"
          stroke="#FFC53D" stroke-opacity="0.28"/>
    <text x="1180" y="1091" text-anchor="middle" fill="#F2C463">30+ deprecations</text>
  </g>
</svg>
