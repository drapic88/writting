<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1000" viewBox="0 0 2000 1000" role="img" aria-label="Tiho jutro u praznoj kući: otrcani dječak stoji sam na prozoru, gledamo ga s leđa. Kroz prozor se vidi kako obitelj s bebom u daljini ide prema maloj kamenoj crkvi. Na stolu leži prazna tikvica.">
<!-- likovi -->
<rect x="0" y="0" width="2000" height="1000" fill="url(#zid-kamen)"/>
<rect x="0" y="0" width="2000" height="1000" fill="#B9C4D6" opacity=".22"/>
<rect x="0" y="0" width="2000" height="70" fill="#5A3B26"/>
<g fill="#6B4A2E" class="obris"><rect x="-10" y="58" width="2020" height="26"/><rect x="420" y="0" width="34" height="96"/><rect x="1580" y="0" width="34" height="96"/></g>

<!-- veliki prozor s pogledom na crkvu -->
<g>
  <rect x="1080" y="180" width="760" height="560" fill="#5A5248" class="obris"/>
  <svg x="1104" y="202" width="712" height="516" viewBox="0 0 712 516">
    <rect width="712" height="516" fill="url(#g-nebo-dan)"/>
    <use href="#oblak" transform="translate(160,90) scale(.5)"/>
    <use href="#oblak" transform="translate(560,60) scale(.4)"/>
    <path d="M0,300 Q180,260 360,286 T712,272 L712,516 L0,516 Z" fill="#97A58E"/>
    <path d="M0,360 Q200,330 400,350 T712,340 L712,516 L0,516 Z" fill="#BCC385"/>
    <path d="M0,516 C140,470 300,440 420,410 S560,370 600,360 L620,366 C580,380 460,430 360,470 S180,516 140,516 Z" fill="#D9C9A0"/>
    <use href="#crkva" transform="translate(600,362) scale(.75)"/>
    <use href="#hrast" transform="translate(500,350) scale(.4)"/>
    <use href="#hrast" transform="translate(690,354) scale(.38)"/>
    <g transform="translate(470,412) scale(.32)">
      <use href="#zena-dijete" transform="translate(0,0) scale(-1,1)"/>
      <use href="#muskarac-stoji" transform="translate(-130,10)" style="--kosa:#E9E4DA;--brci:#E9E4DA;--bore:inline;--prsluk:#3E4659"/>
      <use href="#dijete-djevojcica" transform="translate(110,6)"/>
      <use href="#zena-stoji" transform="translate(-250,20)" style="--bore:inline;--haljina:#3A2E2A"/>
      <use href="#dijete-djecak" transform="translate(220,10)"/>
    </g>
    <use href="#ptica-leti" transform="translate(300,160) scale(1.2)"/>
  </svg>
  <path d="M1460,202 V718 M1104,460 H1816" stroke="#6B4A2E" stroke-width="12"/>
  <rect x="1060" y="732" width="800" height="26" fill="#B7B2A8" class="obris"/>
</g>

<!-- pod -->
<rect x="0" y="830" width="2000" height="170" fill="url(#pod-ploce)"/>
<path d="M0,830 H2000" stroke="#7A6A55" stroke-width="5"/>

<!-- stol s praznom tikvicom, ugašeno ognjište -->
<use href="#stol" transform="translate(620,900) scale(1.3)"/>
<use href="#tikvica" transform="translate(600,796) scale(1.1)"/>
<use href="#kruh" transform="translate(700,796) scale(.8)"/>
<use href="#kolijevka" transform="translate(240,900) scale(1.1)"/>
<g opacity=".9">
  <ellipse cx="900" cy="930" rx="70" ry="16" fill="#6E665E" class="obris"/>
  <ellipse cx="900" cy="928" rx="52" ry="9" fill="#5A524A"/>
  <path d="M884,920 q4,-14 0,-26 M902,918 q6,-16 0,-30" fill="none" stroke="#C9C4BA" stroke-width="3" stroke-linecap="round" opacity=".7"/>
</g>

<!-- dječak na prozoru, s leđa -->
<ellipse cx="1460" cy="954" rx="70" ry="10" fill="#000" opacity=".12"/>
<use href="#djecak-prozor-otrcan" transform="translate(1460,950) scale(1.3)"/>
<use href="#macka-spava" transform="translate(1720,980) scale(1)"/>

<rect x="0" y="0" width="2000" height="1000" fill="#6A7FA6" opacity=".1" style="mix-blend-mode:multiply"/>
<rect id="okvir-teksta" data-dvostranica="14" x="60" y="150" width="760" height="300"/>
<rect x="0" y="0" width="2000" height="1000" filter="url(#tekstura)" opacity=".5"/>
</svg>
