<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1000" viewBox="0 0 2000 1000" role="img" aria-label="Toplo jutro na dvorišnim vratima u suhozidu: otrcani dječak prvi podiže ruku i pozdravlja susjeda, sijedog starca sa štapom, koji ga sluša i smješka se. Na zidu sjedi mala ptica i sluša.">
<!-- likovi -->
<rect x="0" y="0" width="2000" height="740" fill="url(#g-nebo-dan)"/>
<circle cx="1700" cy="150" r="200" fill="url(#g-sjaj)"/>
<circle cx="1700" cy="150" r="50" fill="#FFD27A" stroke="#F2B45A" stroke-width="3"/>
<use href="#oblak" transform="translate(1100,140) scale(.6)"/>
<use href="#ptica-leti" transform="translate(1350,240) scale(1.1)"/>

<path d="M0,560 Q260,520 540,550 T1100,540 T1600,548 T2000,530 L2000,740 L0,740 Z" fill="#97A58E" stroke="#7E8C76" stroke-width="2"/>
<g stroke="#8C877C" stroke-width="5" stroke-dasharray="5 3" stroke-linecap="round" stroke-linejoin="round">
  <path d="M1200,610 L1360,592 L1390,626 L1230,642 Z" fill="#C7BC86"/>
  <path d="M1390,626 L1360,592 L1520,586 L1560,618 Z" fill="#93A764"/>
</g>
<use href="#crkva" transform="translate(1680,610) scale(.35)"/>
