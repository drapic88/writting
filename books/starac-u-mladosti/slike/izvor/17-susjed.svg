<use href="#kuca" transform="translate(1080,612) scale(.28)"/>
<use href="#hrast" transform="translate(1800,620) scale(.5)"/>

<path d="M0,700 Q500,670 1000,690 T2000,684 L2000,1000 L0,1000 Z" fill="#BCC385"/>
<path d="M0,700 Q500,670 1000,690 T2000,684 L2000,1000 L0,1000 Z" fill="url(#trava)" opacity=".8"/>

<!-- dječakova kuća (lijevo), dvorište -->
<use href="#kuca" transform="translate(280,840) scale(1.3)" style="--prozor:#34405A"/>
<use href="#supa" transform="translate(680,830) scale(1.0)"/>
<use href="#motika" transform="translate(724,826) rotate(-80) scale(.7)"/>
<use href="#kokos" transform="translate(560,900) scale(.9)"/>
<use href="#macka-spava" transform="translate(130,880) scale(.9)"/>

<!-- suhozid s dvorišnim vratima -->
<use href="#suhozid" transform="translate(840,850) scale(1.3,1.6)"/>
<use href="#suhozid" transform="translate(1440,850) scale(1.9,1.6)"/>
<g>
  <rect x="1222" y="700" width="26" height="160" fill="#8A877C" class="obris"/>
  <rect x="1428" y="700" width="26" height="160" fill="#8A877C" class="obris"/>
  <path d="M1248,720 L1300,700 L1300,860 L1248,850 Z" fill="url(#daske)" class="obris"/>
</g>
<use href="#ptica" transform="translate(1700,800) scale(1.6)"/>

<!-- dječak pozdravlja susjeda -->
<g fill="#000" opacity=".13"><ellipse cx="1120" cy="940" rx="65" ry="12"/><ellipse cx="1420" cy="944" rx="80" ry="12"/></g>
<use href="#djecak-pozdrav-otrcan" transform="translate(1120,936) scale(-1.15,1.15)"/>
<use href="#starac-stap" transform="translate(1440,940) scale(-1.25,1.25)" style="--kosa:#ECE8E0;--brci:#ECE8E0;--obrve:#C9C2B6;--prsluk:#3E4659;--koza:#E8B994"/>

<g>
