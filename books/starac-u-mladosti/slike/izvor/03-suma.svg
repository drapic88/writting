<use href="#ptica-leti" transform="translate(1320,260) scale(1.2)"/>
<use href="#ptica-leti" transform="translate(1370,236) scale(.9)"/>

<!-- planine i brda -->
<path d="M0,520 L140,470 L300,505 L460,460 L640,500 L820,468 L1000,505 L1180,458 L1360,498 L1540,462 L1720,500 L1880,468 L2000,490 L2000,660 L0,660 Z" fill="#A9B4C6" stroke="#8F9BB0" stroke-width="2" stroke-linejoin="round"/>
