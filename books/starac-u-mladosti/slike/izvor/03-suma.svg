<use href="#vjetar-kovrca" transform="translate(1900,540) scale(1.1)"/>
<use href="#vjetar-kovrca" transform="translate(1520,640) scale(1)"/>

<!-- dječak se javlja šumi, povjetarac mu puše u leđa -->
<ellipse cx="1240" cy="912" rx="60" ry="11" fill="#000" opacity=".12"/>
<use href="#djecak-pozdrav" transform="translate(1240,908) scale(-1.1,1.1)"/>
<use href="#povjetarac" transform="translate(1110,760) scale(1.05)"/>

<!-- cvijeće uz put -->
<g>
  <use href="#cvijet-crveni" transform="translate(860,880) scale(1.6)"/><use href="#cvijet-bijeli" transform="translate(890,900) scale(1.6)"/>
  <use href="#cvijet-zuti" transform="translate(1120,950) scale(1.6)"/><use href="#cvijet-bijeli" transform="translate(1150,966) scale(1.6)"/>
  <use href="#cvijet-crveni" transform="translate(1760,960) scale(1.6)"/><use href="#cvijet-zuti" transform="translate(1800,975) scale(1.6)"/>
  <use href="#cvijet-bijeli" transform="translate(140,980) scale(1.6)"/><use href="#cvijet-crveni" transform="translate(470,975) scale(1.6)"/>
</g>
<use href="#kamen" transform="translate(1040,980) scale(1.1)"/>

<rect id="okvir-teksta" data-dvostranica="3" x="50" y="40" width="760" height="420"/>
<rect x="0" y="0" width="2000" height="1000" filter="url(#tekstura)" opacity=".5"/>
</svg>
