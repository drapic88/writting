<path d="M0,640 Q240,600 480,632 T980,630 T1500,628 T2000,630 L2000,760 L0,760 Z" fill="#A3AE72" stroke="#7F8B57" stroke-width="2"/>
<g stroke="#8C877C" stroke-width="5" stroke-dasharray="5 3" stroke-linecap="round" stroke-linejoin="round">
  <path d="M60,668 L220,646 L250,686 L90,706 Z" fill="#C7BC86"/>
  <path d="M250,686 L220,646 L380,640 L420,676 Z" fill="#93A764"/>
  <path d="M820,660 L980,642 L1010,676 L850,692 Z" fill="#B9AE78"/>
  <path d="M1010,676 L980,642 L1140,636 L1180,668 Z" fill="#8FA05F"/>
</g>

<!-- šuma iza (desno) -->
<use href="#hrast" transform="translate(1420,700) scale(1.0)"/>
<use href="#hrast" transform="translate(1560,690) scale(1.1)"/>
<use href="#hrast" transform="translate(1700,700) scale(1.0)"/>
<use href="#hrast" transform="translate(1850,690) scale(1.15)"/>
<use href="#hrast" transform="translate(1990,700) scale(1.0)"/>

<!-- selo (lijevo) -->
<use href="#dim" transform="translate(272,560) scale(.7)"/>
<use href="#dim" transform="translate(442,575) scale(.6)"/>
<use href="#crkva" transform="translate(80,720) scale(.55)"/>
<use href="#kuca" transform="translate(200,740) scale(.6)"/>
<use href="#kuca" transform="translate(380,735) scale(.55)"/>
<use href="#kuca" transform="translate(560,748) scale(.5)"/>

<!-- livada -->
<path d="M0,740 Q500,712 1000,736 T2000,730 L2000,1000 L0,1000 Z" fill="#BCC385"/>
<path d="M0,740 Q500,712 1000,736 T2000,730 L2000,1000 L0,1000 Z" fill="url(#trava)" opacity=".8"/>

<!-- život u selu -->
<use href="#bunar" transform="translate(690,790) scale(.8)"/>
<use href="#zena-stoji" transform="translate(640,800) scale(.42)" style="--haljina:#3A2E2A"/>
<use href="#kokos" transform="translate(300,800) scale(.8)"/>
<use href="#kokos" transform="translate(340,808) scale(-.8,.8)"/>
<use href="#magarac" transform="translate(150,830) scale(.75)"/>
<use href="#muskarac-stoji" transform="translate(95,840) scale(.5)"/>

<!-- put iz sela do šume -->
<path d="M420,760 C620,790 760,800 900,830 S1180,880 1320,900 S1500,940 1560,1000 L1700,1000 C1640,930 1520,880 1380,860 S1080,800 900,790 S560,764 460,752 Z" fill="#D9C9A0" stroke="#BFAE84" stroke-width="2"/>

<!-- suhozid u prvom planu -->
<use href="#suhozid" transform="translate(-20,910)"/>
<use href="#suhozid" transform="translate(300,920)"/>
<use href="#suhozid" transform="translate(620,930) scale(.9,1)"/>

<!-- šuma, prednji red -->
<use href="#hrast" transform="translate(1440,880) scale(1.75)"/>
<use href="#hrast" transform="translate(1640,860) scale(1.6)"/>
<use href="#hrast" transform="translate(1820,890) scale(1.9)"/>
<use href="#hrast" transform="translate(1990,870) scale(1.7)"/>
