<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1000" viewBox="0 0 2000 1000" role="img" aria-label="U zoru dječak prašnjavim putem iz sela dolazi do šume iz koje se čuju čudni zvukovi; staje pred prvo drvo i podiže ruku na pozdrav, a povjetarac od lišća puše mu u leđa.">
<!-- likovi -->

<rect x="0" y="0" width="2000" height="700" fill="url(#g-nebo-zora)"/>
<circle cx="900" cy="478" r="160" fill="url(#g-sjaj)"/>
<circle cx="900" cy="478" r="44" fill="#FFD27A" stroke="#F2B45A" stroke-width="3"/>
<use href="#oblak" transform="translate(1180,170) scale(.55)"/>
