<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1000" viewBox="0 0 2000 1000" role="img" aria-label="Vedro jutro pred kućom staraca na rubu šume: dječak nosi naručje drva, starica mu pruža malu kesicu boba vezanu crvenom vunom, a starac rukom pokazuje put koji vijuga u brda.">
<!-- likovi -->

<rect x="0" y="0" width="2000" height="720" fill="url(#g-nebo-dan)"/>
<use href="#oblak" transform="translate(880,160) scale(.6)"/>
<use href="#oblak" transform="translate(420,110) scale(.45)"/>
<use href="#ptica-leti" transform="translate(700,230)"/><use href="#ptica-leti" transform="translate(740,210) scale(.8)"/>

<!-- brda s putem (desno) -->
<path d="M0,520 L160,470 L340,505 L520,455 L700,500 L880,462 L1060,500 L1240,450 L1420,494 L1600,456 L1780,498 L2000,462 L2000,680 L0,680 Z" fill="#A9B4C6" stroke="#8F9BB0" stroke-width="2" stroke-linejoin="round"/>
<path d="M0,600 Q260,548 540,586 T1100,566 T1600,560 T2000,548 L2000,760 L0,760 Z" fill="#97A58E" stroke="#7E8C76" stroke-width="2"/>
<path d="M900,700 Q1200,610 1500,640 T2000,600 L2000,800 L900,800 Z" fill="#A3AE72" stroke="#7F8B57" stroke-width="2"/>
