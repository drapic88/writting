  <path d="M1420,650 L1560,630 L1590,664 L1450,684 Z" fill="#C7BC86"/>
  <path d="M1590,664 L1560,630 L1720,620 L1760,652 Z" fill="#93A764"/>
  <path d="M1760,652 L1720,620 L1880,612 L1920,644 Z" fill="#B9AE78"/>
</g>
<use href="#ovca" transform="translate(1640,618) scale(.3)"/><use href="#ovca" transform="translate(1670,622) scale(.3)"/><use href="#ovca" transform="translate(1700,616) scale(.3)"/>
<use href="#muskarac-stoji" transform="translate(1730,624) scale(.2)"/>
<use href="#hrast" transform="translate(1300,668) scale(.4)"/><use href="#hrast" transform="translate(1860,610) scale(.35)"/>

<!-- šuma iza kuće (lijevo) -->
<use href="#hrast" transform="translate(40,700) scale(1.4)"/>
<use href="#hrast" transform="translate(190,660) scale(1.2)"/>
<use href="#hrast" transform="translate(540,680) scale(1.3)"/>
<use href="#hrast" transform="translate(680,700) scale(1.1)"/>

<!-- livada -->
<path d="M0,760 Q500,730 1000,756 T2000,748 L2000,1000 L0,1000 Z" fill="#BCC385"/>
<path d="M0,760 Q500,730 1000,756 T2000,748 L2000,1000 L0,1000 Z" fill="url(#trava)" opacity=".8"/>

<!-- put u brda -->
<path d="M1100,1000 C1140,930 1260,900 1380,870 S1600,800 1700,760 S1860,700 1960,680 L1990,690 C1880,720 1760,780 1640,830 S1360,930 1290,1000 Z" fill="#D9C9A0" stroke="#BFAE84" stroke-width="2"/>

<!-- kuća staraca -->
<use href="#dim" transform="translate(470,530) scale(.8)"/>
<use href="#kuca" transform="translate(370,830) scale(1.25)"/>
<g class="obris" fill="#8A5E3A">
  <rect x="590" y="770" width="110" height="18" rx="9"/><rect x="584" y="788" width="120" height="18" rx="9"/><rect x="596" y="752" width="100" height="18" rx="9"/>
</g>
<g fill="#D9B98A" stroke="#3A2A20" stroke-width="1.5"><ellipse cx="590" cy="779" rx="5" ry="8"/><ellipse cx="584" cy="797" rx="5" ry="8"/><ellipse cx="596" cy="761" rx="5" ry="8"/></g>
<use href="#kokos" transform="translate(130,880) scale(.9)"/>
<use href="#kokos" transform="translate(180,892) scale(-.9,.9)"/>

<!-- starica pruža kesicu, dječak s drvima, starac pokazuje put -->
<g fill="#000" opacity=".12"><ellipse cx="680" cy="922" rx="70" ry="12"/><ellipse cx="880" cy="922" rx="60" ry="12"/><ellipse cx="1210" cy="922" rx="70" ry="12"/></g>
<use href="#zena-pruza" transform="translate(680,918) scale(1.2)" style="--bore:inline;--haljina:#3A2E2A;--pregaca:#2E3E6E"/>
<use href="#kesica" transform="translate(792,738) scale(1.3)"/>
<use href="#djecak-nosi-drva" transform="translate(890,920) scale(1.08)"/>
<use href="#muskarac-pokazuje" transform="translate(1210,918) scale(1.22)" style="--kosa:#E9E4DA;--brci:#E9E4DA;--obrve:#B9B2A6;--bore:inline;--koza:#E8B994;--prsluk:#3E4659"/>

<!-- cvijeće -->
<g>
