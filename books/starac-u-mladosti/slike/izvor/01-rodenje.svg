  <g class="obris">
    <path d="M150,360 Q146,320 170,316 Q194,320 190,360 Z" fill="#B8603A"/>
    <path d="M214,360 Q208,330 226,326 L244,326 Q262,330 256,360 Z" fill="#D9C7A0"/>
    <ellipse cx="300" cy="350" rx="30" ry="10" fill="#C88A48"/>
    <path d="M346,360 Q340,316 364,312 Q388,316 382,360 Z" fill="#8E5E37"/>
  </g>
</g>

<!-- škrinja, raspelo, bakrenjak -->
<use href="#skrinja" transform="translate(240,792)"/>
<g class="obris"><rect x="652" y="250" width="12" height="80" fill="#6B4A2E"/><rect x="634" y="270" width="48" height="12" fill="#6B4A2E"/></g>
<circle cx="1640" cy="560" r="5" fill="#3A2A20"/>
<use href="#bakrenjak" transform="translate(1640,620)"/>
<!-- prozor -->
<g>
  <rect x="1150" y="400" width="130" height="120" fill="#5A5248" class="obris"/>
  <rect x="1166" y="414" width="98" height="92" fill="url(#g-nebo-dan)"/>
  <use href="#oblak" transform="translate(1210,450) scale(.25)"/>
  <use href="#ptica-leti" transform="translate(1238,486) scale(.8)"/>
  <path d="M1215,414 V506 M1166,460 H1264" stroke="#6B4A2E" stroke-width="5"/>
  <rect x="1142" y="512" width="146" height="14" fill="#B7B2A8" class="obris"/>
</g>

<!-- otvorena vrata u dvorište -->
<g>
  <rect x="1740" y="330" width="200" height="470" fill="#4A3A2E" class="obris"/>
  <rect x="1756" y="346" width="168" height="454" fill="url(#g-nebo-dan)"/>
  <path d="M1756,640 Q1840,620 1924,636 V800 H1756 Z" fill="#A3AE72"/>
  <path d="M1756,700 Q1840,690 1924,700 V800 H1756 Z" fill="#BCC385"/>
