<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1000" viewBox="0 0 2000 1000" role="img" aria-label="U kamenoj kući punoj veselja majka drži novorođenu bebu, a dječak, najstariji, gleda je u čudu; djed sjedi na tronošcu, a na klinu na zidu visi torba s resama.">
<!-- likovi -->

<!-- zid i strop -->
<rect x="0" y="0" width="2000" height="800" fill="url(#zid-kamen)"/>
<rect x="0" y="0" width="2000" height="800" fill="#F3DDB0" opacity=".18"/>
<rect x="0" y="0" width="2000" height="70" fill="#5A3B26"/>
<g fill="#6B4A2E" class="obris">
  <rect x="-10" y="58" width="2020" height="26"/>
  <rect x="140" y="0" width="34" height="96"/><rect x="560" y="0" width="34" height="96"/>
  <rect x="1240" y="0" width="34" height="96"/><rect x="1660" y="0" width="34" height="96"/>
</g>
<!-- sušeno bilje i luk s grede -->
<g stroke="#3A2A20" stroke-width="1.5">
