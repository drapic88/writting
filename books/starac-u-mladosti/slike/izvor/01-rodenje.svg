<use href="#kolijevka" transform="translate(1310,918) scale(1.05)"/>
<use href="#zena-pruza" transform="translate(1180,912) scale(-1.25,1.25)" style="--bore:inline;--haljina:#3A2E2A;--pregaca:#2E3E6E"/>

