  <rect x="1924" y="346" width="28" height="454" fill="url(#daske)" class="obris" transform="skewY(-8) translate(0,272)"/>
</g>

<!-- klin s torbom -->
<circle cx="1640" cy="410" r="6" fill="#3A2A20"/>
<path d="M1640,410 L1610,452 M1640,410 L1670,452" stroke="#7E2020" stroke-width="5"/>
<use href="#torba" transform="translate(1640,450)"/>

<!-- pod -->
<rect x="0" y="790" width="2000" height="210" fill="url(#pod-ploce)"/>
<path d="M0,790 H2000" stroke="#7A6A55" stroke-width="5"/>

