<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1000" viewBox="0 0 2000 1000" role="img" aria-label="U sumrak u dvorištu dječakove kuće ukućani se vraćaju s polja s motikama i s paše s ovcama. U sredini otrcani, počupani dječak predaje tikvicu svete vode majci s bebom; uz vrata šupe stoji motika. Nitko ne primjećuje kako dječak izgleda.">
<!-- likovi -->
<rect x="0" y="0" width="2000" height="760" fill="url(#g-nebo-vecer)"/>
<g fill="#FFF3C4"><use href="#zvijezda" transform="translate(860,80) scale(.6)"/><use href="#zvijezda" transform="translate(1000,180) scale(.4)"/><use href="#zvijezda" transform="translate(620,60) scale(.5)"/></g>
<use href="#mjesec" transform="translate(760,150) scale(.6)" fill="#F8EBB8" stroke="#E2CF8A" stroke-width="2"/>

<path d="M0,560 Q260,520 540,550 T1100,540 T1600,548 T2000,530 L2000,760 L0,760 Z" fill="#7E7A96"/>
<path d="M0,690 Q500,660 1000,682 T2000,676 L2000,1000 L0,1000 Z" fill="#9AA668"/>
<path d="M0,690 Q500,660 1000,682 T2000,676 L2000,1000 L0,1000 Z" fill="url(#trava)" opacity=".6"/>
<use href="#hrast" transform="translate(1960,720) scale(1.2)"/>
<use href="#hrast" transform="translate(1100,690) scale(.7)"/>

<!-- kuća, šupa, suhozid oko dvorišta -->
<use href="#dim" transform="translate(470,420) scale(.9)"/>
<use href="#kuca" transform="translate(340,800) scale(1.45)" style="--prozor:#F2B45A"/>
<use href="#supa" transform="translate(760,790) scale(1.15)"/>
<use href="#motika" transform="translate(810,786) rotate(-80) scale(.8)"/>
<use href="#suhozid" transform="translate(880,780) scale(.9,.8)"/>
<use href="#suhozid" transform="translate(1660,770) scale(1.1,.8)"/>
<use href="#kokos" transform="translate(860,880) scale(.9)"/>
<use href="#kokos" transform="translate(905,892) scale(-.9,.9)"/>
<use href="#macka-spava" transform="translate(150,830) scale(.9)"/>

<!-- ukućani se vraćaju -->
<use href="#ovca" transform="translate(1720,860) scale(.85)"/>
<use href="#ovca" transform="translate(1810,880) scale(.9)"/>
<use href="#ovca" transform="translate(1900,866) scale(.85)"/>
<use href="#dijete-djecak" transform="translate(1860,900) scale(.9)" style="--prsluk:#2E3E6E"/>
<g transform="translate(1660,912) scale(1.05)">
  <use href="#motika" transform="translate(-70,-260) rotate(40) scale(.95)"/>
  <use href="#muskarac-stoji" style="--prsluk:#3E4659"/>
</g>
<use href="#dijete-djevojcica" transform="translate(1530,920) scale(1.2)"/>

<!-- predaja tikvice -->
<g fill="#000" opacity=".14"><ellipse cx="1160" cy="928" rx="70" ry="12"/><ellipse cx="1390" cy="928" rx="70" ry="12"/></g>
<use href="#djecak-predaje-otrcan" transform="translate(1160,924) scale(1.12)"/>
<use href="#zena-dijete" transform="translate(1390,924) scale(-1.22,1.22)"/>
<use href="#klupa" transform="translate(640,930) scale(1.5)"/>
<use href="#muskarac-sjedi" transform="translate(640,930) scale(1.05)" style="--kosa:#E9E4DA;--brci:#E9E4DA;--obrve:#B9B2A6;--bore:inline;--koza:#E8B994;--prsluk:#3E4659"/>

<!-- svjetlo iz prozora -->
<circle cx="440" cy="690" r="180" fill="url(#g-sjaj-vatra)" style="mix-blend-mode:screen"/>
<rect x="0" y="0" width="2000" height="1000" fill="#3A2E5A" opacity=".12" style="mix-blend-mode:multiply"/>

<rect id="okvir-teksta" data-dvostranica="13" x="1150" y="30" width="790" height="380"/>
<rect x="0" y="0" width="2000" height="1000" filter="url(#tekstura)" opacity=".5"/>
</svg>
