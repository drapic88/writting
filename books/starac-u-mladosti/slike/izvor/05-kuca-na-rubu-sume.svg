<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1000" viewBox="0 0 2000 1000" role="img" aria-label="Noću na rubu šume stoji mala kamena kuća otvorenih vrata; unutra uz ognjište starac i starica večeraju za sinijom, a dječak na pragu podiže ruku na pozdrav. Kraj vatre spava mačka.">
<!-- likovi -->

<rect x="0" y="0" width="2000" height="760" fill="url(#g-nebo-noc)"/>
<g fill="#FFF3C4">
  <use href="#zvijezda" transform="translate(900,90) scale(.8)"/><use href="#zvijezda" transform="translate(1020,170) scale(.5)"/>
  <use href="#zvijezda" transform="translate(1180,70) scale(.6)"/><use href="#zvijezda" transform="translate(1320,150) scale(.9)"/>
  <use href="#zvijezda" transform="translate(1480,60) scale(.5)"/><use href="#zvijezda" transform="translate(1610,190) scale(.7)"/>
  <use href="#zvijezda" transform="translate(1760,80) scale(.6)"/><use href="#zvijezda" transform="translate(1900,160) scale(.8)"/>
  <use href="#zvijezda" transform="translate(980,300) scale(.4)"/><use href="#zvijezda" transform="translate(1860,320) scale(.5)"/>
</g>
<use href="#mjesec" transform="translate(1700,120) scale(.9)" fill="#F8EBB8" stroke="#E2CF8A" stroke-width="2"/>

<!-- brda u noći -->
<path d="M0,560 Q240,500 520,540 T1100,520 T1600,540 T2000,520 L2000,760 L0,760 Z" fill="#33405F"/>

<!-- šuma (lijevo i iza) -->
<g opacity=".95">
  <use href="#hrast" transform="translate(60,700) scale(1.5)"/>
  <use href="#hrast" transform="translate(220,660) scale(1.3)"/>
  <use href="#hrast" transform="translate(380,690) scale(1.5)"/>
  <use href="#hrast" transform="translate(540,650) scale(1.2)"/>
  <use href="#hrast" transform="translate(680,690) scale(1.35)"/>
  <use href="#hrast" transform="translate(1900,690) scale(1.3)"/>
</g>

<!-- tlo -->
<path d="M0,720 Q600,700 1200,716 T2000,712 L2000,1000 L0,1000 Z" fill="#5E6A48"/>
<path d="M0,720 Q600,700 1200,716 T2000,712 L2000,1000 L0,1000 Z" fill="url(#trava)" opacity=".5"/>
<use href="#hrast" transform="translate(130,940) scale(2.1)"/>
<use href="#hrast" transform="translate(-40,960) scale(1.9)"/>

<rect x="0" y="0" width="2000" height="1000" fill="#1E2A50" opacity=".45" style="mix-blend-mode:multiply"/>
<!-- kuća u presjeku: prednji zid uklonjen, vidi se unutrašnjost -->
<g>
  <rect x="1060" y="232" width="40" height="70" fill="#CFC5B2" class="obris"/>
  <use href="#dim" transform="translate(1080,232) scale(.9)"/>
  <path d="M1040,330 L1400,150 L1760,330 Z" fill="url(#ploce)" class="obris"/>
  <path d="M1040,330 H1760" stroke="#5A5248" stroke-width="8"/>
  <rect x="1060" y="330" width="680" height="560" fill="#6B5A48" class="obris"/>
  <rect x="1060" y="330" width="680" height="560" fill="url(#zid-kamen)" opacity=".55"/>
  <rect x="1060" y="330" width="680" height="560" fill="#3A2A30" opacity=".45"/>
  <rect x="1080" y="760" width="640" height="130" fill="url(#pod-ploce)"/>
  <!-- unutra -->
  <circle cx="1450" cy="760" r="380" fill="url(#g-sjaj-vatra)"/>
  <path d="M1450,330 V620" stroke="#2A2520" stroke-width="4" stroke-dasharray="7 4"/>
  <use href="#ognjiste" transform="translate(1450,830) scale(1.05)"/>
  <use href="#bakrenjak" transform="translate(1640,560)"/>
  <circle cx="1640" cy="500" r="5" fill="#3A2A20"/>
  <use href="#tronozac" transform="translate(1310,872)"/>
  <use href="#muskarac-sjedi" transform="translate(1310,872) scale(1.0)" style="--kosa:#E9E4DA;--brci:#E9E4DA;--obrve:#B9B2A6;--bore:inline;--koza:#E8B994;--prsluk:#3E4659"/>
  <use href="#tronozac" transform="translate(1595,876)"/>
  <use href="#zena-sjedi" transform="translate(1595,876) scale(1.0)" style="--bore:inline;--haljina:#3A2E2A;--pregaca:#2E3E6E"/>
  <use href="#sinija" transform="translate(1450,900) scale(1.1)"/>
  <g transform="translate(1450,858)">
    <use href="#kruh" transform="translate(-30,0) scale(.7)"/>
    <ellipse cx="30" cy="-6" rx="24" ry="8" fill="#D9C7A0" class="obris"/>
    <ellipse cx="30" cy="-9" rx="16" ry="4" fill="#E8DCC2"/>
  </g>
  <use href="#macka-spava" transform="translate(1680,888) scale(.8)"/>
  <!-- zidovi presjeka -->
  <rect x="1040" y="330" width="24" height="580" fill="url(#zid-kamen)" class="obris"/>
  <rect x="1736" y="330" width="24" height="580" fill="url(#zid-kamen)" class="obris"/>
  <rect x="1040" y="890" width="720" height="24" fill="url(#zid-kamen)" class="obris"/>
</g>

<!-- dječak na pragu (s lijeve strane kuće) -->
<g>
  <rect x="1046" y="690" width="40" height="200" fill="url(#daske)" class="obris" transform="skewY(14) translate(0,-262)"/>
  <path d="M930,930 Q990,920 1046,905" fill="none" stroke="#8C877C" stroke-width="22" stroke-linecap="round" stroke-dasharray="20 8"/>
  <ellipse cx="915" cy="918" rx="60" ry="11" fill="#000" opacity=".25"/>
  <use href="#djecak-pozdrav" transform="translate(915,914) scale(-1.05,1.05)"/>
</g>

<!-- noćna svjetla -->
<circle cx="1050" cy="820" r="260" fill="url(#g-sjaj-vatra)" style="mix-blend-mode:screen"/>

<rect id="okvir-teksta" data-dvostranica="4" x="50" y="40" width="760" height="400"/>
<rect x="0" y="0" width="2000" height="1000" filter="url(#tekstura)" opacity=".5"/>
</svg>
